name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (engine, Live Set export/import)
        run: ./gradlew :core:test --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SpectraSeq-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Upload example Live Set
        uses: actions/upload-artifact@v4
        with:
          name: example-live-set
          path: core/build/test-output/sketch.als

      - name: Publish APK as a GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk SpectraSeq.apk
          cp app/build/outputs/apk/debug/app-debug.apk SpectraSeq-debug.apk
          cp core/build/test-output/sketch.als example-sketch.als
          TAG="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" SpectraSeq.apk SpectraSeq-debug.apk example-sketch.als \
            --target "$GITHUB_SHA" --prerelease \
            --title "SpectraSeq build (${GITHUB_REF_NAME})" \
            --notes "Latest build of ${GITHUB_REF_NAME} (${GITHUB_SHA::7}).

          Install: open this page on your phone, download SpectraSeq.apk and open it (allow installing from your browser / file manager when Android asks).
          example-sketch.als is a test Live Set generated by the exporter; open it in Ableton Live 11 or 12."
